<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NekoCode Pet</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      /* The pet canvas relies on 100%-height to fill the window. A plain
         block #root has auto height, so the percentage would resolve against
         an indefinite parent and the canvas could collapse / mis-size on
         HiDPI displays. Pin it to the viewport explicitly. */
      #root {
        position: fixed;
        inset: 0;
        margin: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./pet.ts" type="module"></script>
  </body>
</html>
